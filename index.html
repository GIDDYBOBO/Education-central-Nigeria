    <script>
      // Defensive guard against third-party browser extension injection collisions
      (function() {
        try {
          var _eth = window.ethereum;
          Object.defineProperty(window, 'ethereum', {
            configurable: true,
            enumerable: true,
            get: function() { return _eth; },
            set: function(val) { _eth = val; }
          });
        } catch (err) {}

        // Suppress external extension errors from bubbling to window
        window.addEventListener('error', function(event) {
          if (
            (event.filename && (event.filename.indexOf('chrome-extension://') !== -1 || event.filename.indexOf('moz-extension://') !== -1)) ||
            (event.message && (event.message.indexOf('ethereum') !== -1 || event.message.indexOf('Cannot redefine property') !== -1))
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var msg = event && event.reason && event.reason.message;
          if (typeof msg === 'string' && (msg.indexOf('chrome-extension://') !== -1 || msg.indexOf('ethereum') !== -1)) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
